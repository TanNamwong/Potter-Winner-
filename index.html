<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PotterWinner - Trail Jungle Run</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="icon-192.png">
    <meta name="theme-color" content="#2e7d32">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PotterWinner">
    <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
    <div id="game-container">
        <!-- Start / Selection Screen -->
        <div id="selection-screen" class="screen">
            <div class="header-row">
                <h1>🌲 PotterWinner 🏃‍♂️</h1>
                <div class="app-actions">
                    <button id="btn-install" class="btn-action hidden">📲 ติดตั้งลงหน้าจอ Home</button>
                    <button id="btn-update" class="btn-action" onclick="checkForUpdate()">🔄 อัปเดตแอป</button>
                </div>
            </div>
            
            <div class="content-scrollable">
                <h2>เลือกตัวละครของคุณ</h2>
                <div class="character-container">
                    <div class="card selected" id="card-potter" onclick="selectCharacter('POTTER')">
                        <div class="avatar-frame">
                            <img src="face-potter.jpg" alt="Potter" class="char-img">
                        </div>
                        <h3>POTTER (พอตเตอร์)</h3>
                        <p>นักวิ่งสายสปีด ลุยทุกเส้นทาง</p>
                    </div>
                    <div class="card" id="card-winner" onclick="selectCharacter('WINNER')">
                        <div class="avatar-frame">
                            <img src="face-winner.jpg" alt="Winner" class="char-img">
                        </div>
                        <h3>WINNER (วินเนอร์)</h3>
                        <p>นักวิ่งอารมณ์ดี สายชิลล์ชมวิว</p>
                    </div>
                </div>

                <h2>เลือกโหมดการเล่น</h2>
                <div class="mode-container">
                    <label class="mode-card selected" id="mode-sandbox" onclick="selectMode('SANDBOX')">
                        <input type="radio" name="mode" value="SANDBOX" checked>
                        <div>
                            <strong>🛡️ โหมด Sandbox (วิ่งชมวิว ไม่ตาย)</strong>
                            <p>วิ่งชมวิว ไม่มีสิ่งกีดขวาง ไม่มีวันตาย ปรับสปีดได้ กระโดดเก็บเหรียญได้</p>
                        </div>
                    </label>
                    <label class="mode-card" id="mode-normal" onclick="selectMode('NORMAL')">
                        <input type="radio" name="mode" value="NORMAL">
                        <div>
                            <strong>🏆 โหมดปกติ (หลบสิ่งกีดขวาง)</strong>
                            <p>วิ่งเก็บระยะทาง หลบสิ่งกีดขวาง ท้าทายคะแนนสูงสุด</p>
                        </div>
                    </label>
                    <label class="mode-card" id="mode-adventure" onclick="selectMode('ADVENTURE')">
                        <input type="radio" name="mode" value="ADVENTURE">
                        <div>
                            <strong>🗺️ โหมดผจญภัย (Adventure)</strong>
                            <p>วิ่งให้ครบ 1000 เมตร ผ่านภูเขา ทะเล ทุ่งนา สวน แม่น้ำ มี 3 ชีวิต</p>
                        </div>
                    </label>
                </div>

                <button class="btn-start" onclick="startGame()">เริ่มออกเดินทาง 🚀</button>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen hidden">
            <canvas id="gameCanvas"></canvas>

            <div id="hud">
                <button class="btn-back" onclick="backToMenu()">⬅️ เมนูหลัก</button>
                <button id="btn-pause" class="btn-back btn-pause" onclick="togglePause()">⏸️ พัก</button>

                <div id="biome-badge" class="hud-item badge">📍 <span id="biomeName">ภูเขาสูงสดชื่น 🏔️</span></div>

                <div class="hud-item badge">🪙 <span id="coinVal">0</span></div>

                <div id="sandbox-controls" class="hud-item">
                    <label for="speedSlider">สปีด: <span id="speedVal">5</span>x</label>
                    <input type="range" id="speedSlider" min="1" max="15" value="5" oninput="updateSpeed(this.value)">
                </div>

                <div id="normal-controls" class="hud-item hidden">
                    <span>ระยะ: <span id="scoreVal">0</span> M · สูงสุด <span id="bestVal">0</span></span>
                </div>

                <div id="adventure-controls" class="hud-item hidden">
                    <span id="livesVal">❤️❤️❤️</span> <span>ภารกิจ: <span id="questText">สำรวจ 0/1000M</span></span>
                </div>
            </div>

            <div id="hint" class="toast hint">👆 แตะหน้าจอ / กด Space เพื่อกระโดด (กระโดดซ้อนได้ 2 ครั้ง)</div>

            <div id="overlay" class="hidden">
                <div class="overlay-box">
                    <h2 id="overlay-title"></h2>
                    <p id="overlay-text"></p>
                    <div class="overlay-actions">
                        <button class="btn-start" onclick="restartGame()">🔁 เล่นอีกครั้ง</button>
                        <button class="btn-start btn-secondary" onclick="backToMenu()">เมนูหลัก</button>
                    </div>
                </div>
            </div>

            <div id="toast" class="toast hidden"></div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
